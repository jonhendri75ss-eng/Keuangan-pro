```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Finance Cloud Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAs-demo-key",
            authDomain: "finance-app-demo.firebaseapp.com",
            projectId: "finance-app-demo",
            storageBucket: "finance-app-demo.appspot.com",
            appId: "1:demo"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'finance-cloud-stable-v4';

        let transactions = [];
        let myChart;
        const urlParams = new URLSearchParams(window.location.search);
        let syncId = urlParams.get('sync') || localStorage.getItem('sync_id') || Math.random().toString(36).substring(2, 9);
        localStorage.setItem('sync_id', syncId);
        
        document.getElementById('session-display').innerText = `ID: ${syncId}`;

        async function initApp() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', syncId);
                        onSnapshot(docRef, (docSnap) => {
                            if (docSnap.exists()) {
                                transactions = docSnap.data().list || [];
                            } else {
                                transactions = [];
                            }
                            updateUI();
                        }, (err) => console.error("Data error:", err));
                    }
                });
            } catch (err) { console.error("Auth error:", err); }
        }

        window.saveToCloud = async (newList) => {
            if (!auth.currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', syncId);
            await setDoc(docRef, { list: newList });
        };

        window.addTransaction = () => {
            const name = document.getElementById('item-name').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;

            if (!name || isNaN(amount) || amount <= 0) return;

            const newList = [{
                id: Date.now(),
                name,
                amount,
                type,
                category,
                date: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })
            }, ...transactions];
            
            window.saveToCloud(newList);
            document.getElementById('item-name').value = '';
            document.getElementById('amount').value = '';
        };

        window.deleteTransaction = (id) => {
            const newList = transactions.filter(t => t.id !== id);
            window.saveToCloud(newList);
        };

        function updateUI() {
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';
            let bal = 0, exp = 0;
            const cats = { Wajib: 0, Hiburan: 0, Investasi: 0, Lainnya: 0 };

            transactions.forEach(t => {
                if (t.type === 'income') bal += t.amount;
                else { 
                    bal -= t.amount; 
                    exp += t.amount; 
                    cats[t.category] = (cats[t.category] || 0) + t.amount;
                }

                const row = document.createElement('tr');
                row.className = "border-b border-slate-700/50 hover:bg-slate-800/40 transition-all";
                row.innerHTML = `
                    <td class="px-4 py-4">
                        <div class="font-bold text-slate-200 text-sm">${t.name}</div>
                        <div class="text-[10px] text-slate-500 font-bold uppercase">${t.date} • ${t.category}</div>
                    </td>
                    <td class="px-4 py-4 font-black text-sm ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">
                        Rp ${t.amount.toLocaleString('id-ID')}
                    </td>
                    <td class="px-4 py-4 text-right">
                        <button onclick="deleteTransaction(${t.id})" class="text-slate-600 hover:text-rose-500 p-2">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </td>
                `;
                list.appendChild(row);
            });

            document.getElementById('balance').innerText = `Rp ${bal.toLocaleString('id-ID')}`;
            document.getElementById('total-expense').innerText = `Rp ${exp.toLocaleString('id-ID')}`;
            updateChart(cats);
            lucide.createIcons();
        }

        function updateChart(cats) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(cats),
                    datasets: [{
                        data: Object.values(cats),
                        backgroundColor: ['#3b82f6', '#f59e0b', '#10b981', '#64748b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } } }
                }
            });
        }

        window.analyzeLeakage = () => {
            const totalExp = transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
            const lifestyle = transactions.filter(t => t.type === 'expense' && (t.category === 'Hiburan' || t.category === 'Lainnya')).reduce((a, b) => a + b.amount, 0);
            const box = document.getElementById('leakage-result');
            box.classList.remove('hidden');
            
            if (totalExp === 0) {
                box.innerHTML = "Belum ada data pengeluaran.";
                box.className = "mt-4 p-4 bg-slate-800 rounded-xl text-xs text-center";
                return;
            }

            const percent = (lifestyle / totalExp) * 100;
            if (percent > 30) {
                box.innerHTML = `⚠️ <strong>Bocor Alus!</strong> ${percent.toFixed(1)}% uang habis untuk jajan/hiburan.`;
                box.className = "mt-4 p-4 bg-rose-900/30 text-rose-400 rounded-xl text-xs border border-rose-800 animate-pulse";
            } else {
                box.innerHTML = `✅ <strong>Dompet Sehat!</strong> Gaya hidup hanya ${percent.toFixed(1)}%.`;
                box.className = "mt-4 p-4 bg-emerald-900/30 text-emerald-400 rounded-xl text-xs border border-emerald-800";
            }
        };

        window.shareSession = () => {
            const url = window.location.origin + window.location.pathname + '?sync=' + syncId;
            const el = document.createElement('textarea');
            el.value = url;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Link Sinkronisasi Berhasil Disalin!");
        };

        initApp();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen pb-20">

    <div class="bg-blue-600 text-white text-[10px] py-1.5 px-4 flex justify-between items-center font-bold sticky top-0 z-[60]">
        <span class="flex items-center gap-1"><i data-lucide="cloud" class="w-3 h-3 text-white"></i> Real-time Cloud Aktif</span>
        <span id="session-display" class="bg-blue-800 px-2 py-0.5 rounded tracking-widest uppercase">ID: ---</span>
    </div>

    <header class="bg-[#1e293b]/80 backdrop-blur-md border-b border-slate-800 sticky top-7 z-50 p-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-black">Finance<span class="text-blue-500">Cloud</span></h1>
            <button onclick="shareSession()" class="p-2.5 bg-slate-800 rounded-xl border border-slate-700 text-blue-400">
                <i data-lucide="share-2" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
        
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-5 rounded-3xl shadow-xl shadow-blue-900/20">
                <p class="text-[10px] font-bold text-blue-100 uppercase mb-1">Saldo Bersih</p>
                <p id="balance" class="text-xl font-black">Rp 0</p>
            </div>
            <div class="bg-[#1e293b] p-5 rounded-3xl border border-slate-800 shadow-xl">
                <p class="text-[10px] font-bold text-rose-500 uppercase mb-1">Total Keluar</p>
                <p id="total-expense" class="text-xl font-black">Rp 0</p>
            </div>
        </div>

        <section class="bg-[#1e293b] p-6 rounded-3xl border border-slate-800 shadow-2xl">
            <h2 class="text-xs font-bold text-slate-500 uppercase mb-4 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-3 h-3 text-blue-500"></i> Input Transaksi
            </h2>
            <div class="space-y-4">
                <input type="text" id="item-name" placeholder="Misal: Gaji, Belanja, Makan..." class="w-full bg-[#0f172a] border border-slate-700 rounded-2xl px-4 py-4 outline-none focus:ring-2 focus:ring-blue-500">
                <div class="grid grid-cols-2 gap-3">
                    <select id="type" class="bg-[#0f172a] border border-slate-700 rounded-2xl px-4 py-3 text-xs font-black">
                        <option value="expense">PENGELUARAN</option>
                        <option value="income">PEMASUKAN</option>
                    </select>
                    <select id="category" class="bg-[#0f172a] border border-slate-700 rounded-2xl px-4 py-3 text-xs font-black">
                        <option value="Wajib">WAJIB/POKOK</option>
                        <option value="Hiburan">HIBURAN</option>
                        <option value="Investasi">INVESTASI</option>
                        <option value="Lainnya">LAINNYA</option>
                    </select>
                </div>
                <input type="number" id="amount" placeholder="Rp 0" class="w-full bg-[#0f172a] border border-slate-700 rounded-2xl px-4 py-4 outline-none text-xl font-black text-blue-400">
                <button onclick="addTransaction()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-sm shadow-xl shadow-blue-900/40 active:scale-95 transition-all">SIMPAN KE CLOUD</button>
            </div>
        </section>

        <section class="bg-[#1e293b] p-6 rounded-3xl border border-slate-800">
            <div class="flex items-center gap-2 mb-4">
                <i data-lucide="zap" class="w-5 h-5 text-amber-500"></i>
                <h2 class="font-bold text-sm">Analisis Kebocoran</h2>
            </div>
            <button onclick="analyzeLeakage()" class="w-full bg-slate-800 py-3 rounded-xl text-xs font-bold border border-slate-700 hover:bg-slate-700 transition-all">CEK KESEHATAN DANA</button>
            <div id="leakage-result" class="hidden"></div>
        </section>

        <div class="bg-[#1e293b] p-6 rounded-3xl border border-slate-800 h-64 shadow-xl">
            <canvas id="myChart"></canvas>
        </div>

        <div class="bg-[#1e293b] rounded-3xl border border-slate-800 shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-800/30">
                <h3 class="font-bold text-xs uppercase tracking-widest text-blue-400">Riwayat Sinkron</h3>
                <i data-lucide="refresh-cw" class="w-3 h-3 text-slate-500"></i>
            </div>
            <div class="max-h-96 overflow-y-auto">
                <table class="w-full text-left">
                    <tbody id="transaction-list"></tbody>
                </table>
            </div>
        </div>
    </main>

</body>
</html>
